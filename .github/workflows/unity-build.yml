name: Unity Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-StandaloneWindows64-
            Library-${{ runner.os }}-

      - name: Build Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: Brickwave84
          buildsPath: build

      - name: Prepare MSI payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceExe = Get-ChildItem -LiteralPath build -Recurse -File -Filter Brickwave84.exe |
            Select-Object -First 1

          if (-not $sourceExe) {
            throw 'Brickwave84.exe was not found in the Unity build output.'
          }

          $payloadDir = Join-Path $PWD 'Builds/Release/Brickwave84'
          if (Test-Path -LiteralPath $payloadDir) {
            Remove-Item -LiteralPath $payloadDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $payloadDir | Out-Null
          Copy-Item -Path (Join-Path $sourceExe.DirectoryName '*') -Destination $payloadDir -Recurse -Force

      - name: Build MSI installer
        shell: pwsh
        run: ./Installer/Scripts/Build-Msi.ps1 -GameBuildDir ./Builds/Release/Brickwave84

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brickwave84-Windows-MSI
          path: Builds/Installer/Brickwave84-*.msi
          if-no-files-found: error
