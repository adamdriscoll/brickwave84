name: Unity Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install packaging dependencies
        shell: powershell
        run: |
          choco install imagemagick.app -y --no-progress
          $magick = Get-Command magick -ErrorAction SilentlyContinue
          if (-not $magick) {
            $imageMagickPath = Get-ChildItem -LiteralPath 'C:\Program Files' -Directory -Filter 'ImageMagick*' |
              Select-Object -First 1

            if (-not $imageMagickPath) {
              throw 'ImageMagick was not found after Chocolatey install.'
            }

            $imageMagickPath.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-StandaloneWindows64-
            Library-${{ runner.os }}-

      - name: Build Windows player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: Brickwave84
          buildsPath: build

      - name: Prepare MSI payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceExe = Get-ChildItem -LiteralPath build -Recurse -File -Filter Brickwave84.exe |
            Select-Object -First 1

          if (-not $sourceExe) {
            throw 'Brickwave84.exe was not found in the Unity build output.'
          }

          $payloadDir = Join-Path $PWD 'Builds/Release/Brickwave84'
          if (Test-Path -LiteralPath $payloadDir) {
            Remove-Item -LiteralPath $payloadDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $payloadDir | Out-Null
          Copy-Item -Path (Join-Path $sourceExe.DirectoryName '*') -Destination $payloadDir -Recurse -Force

      - name: Build MSI installer
        shell: powershell
        run: ./Installer/Scripts/Build-Msi.ps1 -GameBuildDir ./Builds/Release/Brickwave84

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brickwave84-Windows-MSI
          path: Builds/Installer/Brickwave84-*.msi
          if-no-files-found: error
