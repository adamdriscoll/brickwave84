    <path class="thin" d="M99 54l-9-22M157 54l9-22M99 202l-9 22M157 202l9 22"/>
    <path class="fill" d="M128 94l12 24 26 4-19 18 5 26-24-13-24 13 5-26-19-18 26-4z"/>
  </g>
</svg>
