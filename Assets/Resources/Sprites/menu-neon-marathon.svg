    <style><![CDATA[.icon{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;filter:url(#softGlow)}.main{stroke-width:10;opacity:.95}.mid{stroke-width:6;opacity:.78}.thin{stroke-width:3.5;opacity:.4}.fill{fill:#fff;stroke:none;opacity:.92;filter:url(#softGlow)}]]></style>
  </defs>
