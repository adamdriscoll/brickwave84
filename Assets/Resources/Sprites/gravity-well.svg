    <path class="thin" d="M 56 142 C 73 123, 99 115, 128 115 C 157 115, 183 123, 200 142"/>
    <path class="thin" d="M 73 162 C 89 142, 106 135, 128 135 C 150 135, 167 142, 183 162"/>
    <path class="thin" d="M 92 176 C 100 158, 113 151, 128 151 C 143 151, 156 158, 164 176"/>
    <path class="mid" d="M 128 193 C 112 211, 119 222, 128 237 C 137 222, 144 211, 128 193 Z"/>
    <path class="mid" d="M 100 79 C 112 99, 123 111, 128 135"/>
    <path class="thin" d="M 111 73 C 124 94, 133 111, 136 132"/>
    <path class="faint" d="M 64 151 C 104 205, 178 179, 192 126"/>
    <path class="faint" d="M 192 151 C 152 205, 78 179, 64 126"/>
