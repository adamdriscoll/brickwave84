    <style><![CDATA[.icon{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;filter:url(#softGlow)}.main{stroke-width:9;opacity:.96}.mid{stroke-width:6;opacity:.82}.thin{stroke-width:3.5;opacity:.43}.fill{fill:#fff;stroke:none;opacity:.88;filter:url(#softGlow)}]]></style>
