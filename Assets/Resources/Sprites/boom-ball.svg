    <circle class="main" cx="128" cy="132" r="34"/>
    <path class="fill" d="M128 73l12 30 32-14-14 32 31 11-31 11 14 32-32-14-12 30-12-30-32 14 14-32-31-11 31-11-14-32 32 14z"/>
    <path class="mid" d="M128 43v27M128 194v19M62 132H36M220 132h-26M82 86 63 67M174 86l19-19M82 178l-19 19M174 178l19 19"/>
    <path class="mid" d="M50 42h42v24H50zM164 42h42v24h-42zM37 188h44v24H37zM175 188h44v24h-44z"/>
    <path class="thin" d="M61 54h20M175 54h20M49 200h21M187 200h20"/>
  </g>
</svg>
